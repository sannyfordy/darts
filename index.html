<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oche Ledger">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Oche Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky scoreboard header over one working column; live play splits board | pad on wide screens. Chalkboard slate in dark, scoresheet paper in light. */
:root{
  --bg:#eaede7; --surface:#fafbf7; --surface-2:#dfe4dc; --ink:#15201a; --muted:#5a675f; --line:#cbd3ca;
  --red:#c22f29; --green:#18794a; --hi:#a8740a; --heat:#c22f29; --w1:#e6eae2; --w2:#d3d9d0;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b18; --surface:#1c2521; --surface-2:#26312c; --ink:#ebf0e8; --muted:#95a49b; --line:#33403a;
  --red:#ee5d4e; --green:#41c27c; --hi:#f0c95a; --heat:#ff6c50; --w1:#222c28; --w2:#2c3832; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b18; --surface:#1c2521; --surface-2:#26312c; --ink:#ebf0e8; --muted:#95a49b; --line:#33403a;
  --red:#ee5d4e; --green:#41c27c; --hi:#f0c95a; --heat:#ff6c50; --w1:#222c28; --w2:#2c3832; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px 16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;display:flex;gap:8px;align-items:center;line-height:1}
.brand svg{width:24px;height:24px}
.store{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.store i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.store.cloud i{background:var(--green)} .store.ro i{background:var(--hi)}
nav{display:flex;gap:2px;margin-left:auto;background:var(--surface-2);border-radius:9px;padding:3px}
nav button{padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
nav button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (max-width:560px){nav{margin-left:0;width:100%} nav button{flex:1;padding:8px 4px}}

main{padding-block:18px 48px}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px;line-height:1.05;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;line-height:1.1}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:14px;margin:6px 0}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.banner{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:14px}

/* option controls */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chip b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.btn{padding:10px 16px;border-radius:9px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.big{padding:14px 26px;font-size:17px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* live */
.livebar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.legline{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase}
.livegrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.livegrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pcard.act .pm,.pcard.act .eyebrow{color:var(--bg);opacity:.75}
.pcard.out{opacity:.45}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pn{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legs{font-family:var(--f-display);font-weight:800;font-size:18px}
.rem{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.95;letter-spacing:-.01em}
.pm{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.route{margin-top:6px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em;color:var(--hi)}
.route.alt{margin-top:0;font-size:15px;opacity:.75}
.route.setup span{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.8}
.dchips{display:flex;gap:6px;margin-top:8px}
.dchip{flex:1;min-width:0;height:30px;border-radius:6px;border:1px dashed currentColor;opacity:.5;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.dchip.on{opacity:1;border-style:solid}
.log{margin-top:12px;display:flex;flex-direction:column;font-size:14px}
.log div{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line)}
.log span:last-child{color:var(--muted)}

.pad{display:flex;flex-direction:column;gap:8px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:54px;font-family:var(--f-display);font-weight:800;font-size:24px;display:grid;place-items:center;position:relative;line-height:1;touch-action:manipulation}
.key:active{background:var(--surface-2)}
.key small{position:absolute;top:4px;right:6px;font-family:var(--f-body);font-size:10px;font-weight:700;color:var(--muted);max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.key.dim{color:var(--muted);font-weight:600}
.key.sm{font-size:17px;min-height:46px}
.key.mul2.on{background:var(--green);color:#fff;border-color:var(--green)}
.key.mul3.on{background:var(--red);color:#fff;border-color:var(--red)}
.key.enter{background:var(--red);border-color:var(--red);color:#fff;font-size:20px}
.mults,.extras,.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quick{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.quick .key{font-size:17px;min-height:42px}
@media (max-width:480px){.quick{grid-template-columns:repeat(5,1fr)}}
.entry{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.ev{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.ea{color:var(--muted);font-size:14px}
.askq{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;margin:6px 0}
.askrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.tscroll{overflow-x:auto}
.cr td,.cr th{text-align:center}
.cr tbody th{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:0}
.cr td{font-family:var(--f-display);font-weight:800;font-size:26px;height:44px}
.cr td.act,.cr th.act{background:var(--surface-2)}
.cr tr.dead td,.cr tr.dead th{opacity:.35}
.cr .pts{font-family:var(--f-display);font-size:30px;color:var(--ink);font-weight:800;letter-spacing:0}
.lives{display:flex;gap:4px;margin-top:6px}
.lives i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor}
.lives i.f{background:currentColor}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--red);color:#fff}
.badge.live{background:var(--hi);color:#15201a}
.badge.muted{background:var(--surface-2);color:var(--muted)}

/* stats */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;margin-top:4px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.band{border-top:3px solid var(--ink);padding-top:6px}
.band:nth-child(3){border-color:var(--hi)} .band:nth-child(4){border-color:var(--red)}
.band .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.band .s{font-size:12px;color:var(--muted)}
.bars{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:2px}
.bar{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px}
.bt{height:130px;width:100%;display:flex;align-items:flex-end;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 25%}
.bf{width:100%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
.bar.hl .bf{background:var(--red)}
.bv{font-size:12px;font-weight:600}
.bl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bn{font-size:10.5px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:13px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:var(--ink)}
.legend i.a{background:var(--red);height:4px}
.boardwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
@media (min-width:760px){.boardwrap{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
svg.board{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
svg.board [data-act]{cursor:pointer}
.posgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1000px){.posgrid{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
.hits td,.hits th{padding:5px 7px}
svg.board text{fill:var(--muted);font-family:var(--f-display);font-weight:800;font-size:17px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.kv span:nth-child(even){font-weight:700;text-align:right}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.meter b{display:block;height:100%;background:var(--green)}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;flex-wrap:wrap}
.hbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-display);font-weight:800;font-size:20px}
.score b{color:var(--red)}
tr.click,td.click{cursor:pointer}
tr.click:hover td,td.click:hover{background:var(--surface-2)}
.better{font-weight:700;color:var(--green)}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;width:20px;height:20px;border-radius:4px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.form i.w{background:var(--green);color:#fff} .form i.l{background:var(--red);color:#fff}
.vshead{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.vsbig{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9}
.vsmid{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.split{height:8px;border-radius:4px;background:var(--red);overflow:hidden}
.split b{display:block;height:100%;background:var(--ink)}
.cmp td{font-family:var(--f-display);font-size:20px;font-weight:600}
.cmp td.note{font-family:var(--f-body);font-size:13.5px}
.matrix th:first-child{white-space:nowrap}
.matrix td{font-family:var(--f-display);font-size:20px;font-weight:800}
.matrix td .note{font-family:var(--f-body);font-size:12px;font-weight:500}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (min-width:600px){.rem{font-size:78px}.result .w{font-size:72px}.vsbig{font-size:80px}}
/* Older Safari (before 14.1) ignores gap in flex layouts; the page adds .no-flexgap there and these margins stand in. */
.no-flexgap .stack>*+*{margin-top:18px}
.no-flexgap .field>*+*,.no-flexgap .pad>*+*,.no-flexgap .hist>*+*{margin-top:8px}
.no-flexgap .hbody>*+*{margin-top:12px}
.no-flexgap .pcard>*+*{margin-top:2px}
.no-flexgap .bar>*+*{margin-top:3px}
.no-flexgap .brand>*+*,.no-flexgap .ph>*+*,.no-flexgap .dchips>*+*,.no-flexgap .chip>*+*{margin-left:7px}
.no-flexgap .store>*+*,.no-flexgap .lives>*+*,.no-flexgap .bars>*+*,.no-flexgap .form>*+*{margin-left:5px}
.no-flexgap nav>*+*{margin-left:2px}
.no-flexgap .log div>*+*{margin-left:10px}
.no-flexgap .topin>*{margin:4px 14px 4px 0}
.no-flexgap .row,.no-flexgap .opts,.no-flexgap .filters,.no-flexgap .legend,.no-flexgap .pm{margin:-4px}
.no-flexgap .row>*,.no-flexgap .opts>*,.no-flexgap .filters>*,.no-flexgap .legend>*,.no-flexgap .pm>*{margin:4px}
.no-flexgap .resume>*,.no-flexgap .livebar>*,.no-flexgap .hhead>*{margin:4px 12px 4px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.result{text-align:center;padding-block:10px}
.result .w{font-family:var(--f-display);font-weight:800;font-size:44px;text-transform:uppercase;line-height:1}
@media (prefers-reduced-motion:no-preference){.pcard{transition:background .15s,color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <div class="brand"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="11" fill="none" stroke="currentColor" stroke-width="2"/><circle r="6.5" fill="none" stroke="var(--red)" stroke-width="2"/><circle r="2" fill="var(--green)"/></svg>Oche Ledger</div>

    <button data-act="nav" data-v="history">History</button>
    <button data-act="nav" data-v="players">Players</button>

</div></header>
<main class="wrap" id="view"></main>
